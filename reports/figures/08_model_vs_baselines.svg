<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500">
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#252525}.t{font-size:25px;font-weight:700}.s{font-size:14px;fill:#666}.l{font-size:16px}.v{font-size:16px;font-weight:700}</style>
<text x="32" y="42" class="t">2018+ Holdout — Model vs Strong Baselines</text>
<text x="32" y="67" class="s">Mean absolute error (MAE): lower is better.</text>
<text x="231" y="128" text-anchor="end" class="l">Persistence</text>
<rect x="245" y="105" width="145.6" height="34" rx="5" fill="#99ff99"/>
<text x="400.6" y="128" class="v">0.8976</text>
<text x="231" y="200" text-anchor="end" class="l">Climate model</text>
<rect x="245" y="177" width="234.7" height="34" rx="5" fill="#66b3ff"/>
<text x="489.7" y="200" class="v">1.4472</text>
<text x="231" y="272" text-anchor="end" class="l">Country × crop median</text>
<rect x="245" y="249" width="262.6" height="34" rx="5" fill="#c2c2f0"/>
<text x="517.6" y="272" class="v">1.6192</text>
<text x="231" y="344" text-anchor="end" class="l">Crop median</text>
<rect x="245" y="321" width="559.1" height="34" rx="5" fill="#ffcc99"/>
<text x="814.1" y="344" class="v">3.4478</text>
<text x="32" y="455" class="s">The climate model improves on the static country × crop median, but persistence remains substantially better.</text>
</svg>