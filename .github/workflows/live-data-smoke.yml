name: Live data validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/live-data-smoke.yml"

jobs:
  live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - name: Check public data endpoints and build panel
        run: |
          python - <<'PY'
          from climate_crop_yield.data import build_analysis_panel
          from climate_crop_yield.features import add_features, validate_panel

          df = build_analysis_panel(start_year=1990, end_year=2023)
          validate_panel(df)
          df = add_features(df)

          print("LIVE_DATA_ROWS=", len(df))
          print("LIVE_DATA_COUNTRIES=", df["Code"].nunique())
          print("LIVE_DATA_CROPS=", df["crop"].nunique())
          print("LIVE_DATA_YEARS=", df["Year"].min(), df["Year"].max())
          print("LIVE_DATA_MISSING_PCT=")
          print((df.isna().mean() * 100).round(2).sort_values(ascending=False).to_string())

          assert len(df) > 1000
          assert df["crop"].nunique() == 6
          assert df["Code"].nunique() > 30
          PY
      - name: Run full live analysis report
        run: python scripts/run_live_analysis.py
